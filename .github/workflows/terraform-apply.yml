name: Terraform Apply

# Runs only on direct pushes to main (i.e. after a PR is merged).
# This is the only workflow that actually changes AWS infrastructure.
# The plan job on PRs gives reviewers full visibility before merge.

on:
  push:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'

# Least privilege: read-only by default; the apply job adds OIDC.
permissions:
  contents: read

env:
  TF_VERSION: "1.11.4"
  WORKING_DIR: environments/prod

jobs:
  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC authentication to AWS
    # Prevent concurrent applies — two simultaneous applies against the
    # same state file would cause a lock conflict and potential corruption.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false

    environment: prod   # requires a manual approval gate in GitHub settings

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no step pushes with git; don't leave the token on disk
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -input=false -auto-approve
