name: Terraform Apply

# Runs only on direct pushes to main (i.e. after a PR is merged).
# This is the only workflow that actually changes AWS infrastructure.
# The plan job on PRs gives reviewers full visibility before merge.

on:
  push:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'

# Least privilege: read-only by default; the apply job adds OIDC.
permissions:
  contents: read

env:
  TF_VERSION: "1.11.4"
  WORKING_DIR: environments/prod

jobs:
  terraform-apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC authentication to AWS
    # Prevent concurrent applies — two simultaneous applies against the
    # same state file would cause a lock conflict and potential corruption.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false

    environment: prod   # requires a manual approval gate in GitHub settings

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # no step pushes with git; don't leave the token on disk
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform apply -input=false -auto-approve
