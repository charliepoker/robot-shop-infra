name: Terraform Plan

# Runs on every PR targeting main.
# Purpose: catch formatting, validation, security, and cost issues
# before code is merged — not after.
#
# This workflow does NOT apply anything to AWS.
# Applying is handled by terraform-apply.yml on merge to main.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'
      - '.github/workflows/terraform-plan.yml'

# Least privilege: read-only by default; each job adds only what it uses.
permissions:
  contents: read

env:
  TF_VERSION: "1.11.4"
  WORKING_DIR: environments/prod
  # Scanner/linter versions are pinned and their downloads checksum-verified.
  # Dependabot does not track these; bump them deliberately (version + SHA-256 together).
  TFLINT_VERSION: "v0.64.0"
  TFLINT_SHA256: "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537"   # tflint_linux_amd64.zip
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"    # trivy_0.74.0_Linux-64bit.tar.gz
  CHECKOV_VERSION: "3.3.19"
  PRE_COMMIT_VERSION: "4.6.2"

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no step pushes with git; don't leave the token on disk
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Install pre-commit (pinned)
        run: pip install "pre-commit==${PRE_COMMIT_VERSION}"

      - name: Install tflint (pinned, checksum-verified)
        run: |
          curl -sSfLo tflint.zip \
            "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint.zip" | sha256sum -c -
          unzip -o tflint.zip -d /usr/local/bin/
          tflint --version

      - name: Install tflint AWS plugin
        run: tflint --init --config=.tflint.hcl

      - name: Install Trivy (pinned, checksum-verified)
        run: |
          curl -sSfLo trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no step pushes with git; don't leave the token on disk
      - name: Install checkov (pinned)
        run: pip install "checkov==${CHECKOV_VERSION}"

      - name: Run checkov
        run: |
          checkov \
            --directory ${{ env.WORKING_DIR }} \
            --framework terraform \
            --quiet \
            --compact \
            --soft-fail-on MEDIUM \
            --hard-fail-on HIGH,CRITICAL

      - name: Install Trivy (pinned, checksum-verified)
        run: |
          curl -sSfLo trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz -C /usr/local/bin trivy
          trivy --version

      - name: Run Trivy on environments/prod
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ${{ env.WORKING_DIR }}

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC authentication to AWS
      pull-requests: write   # post the plan as a PR comment
    needs: [pre-commit, security-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no step pushes with git; don't leave the token on disk
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # OIDC authentication — no static AWS credentials stored in GitHub.
      # The robot-shop-infra repo needs its own OIDC role separate from
      # the one for robot-shop (application CI). This role needs read
      # access to the S3 backend and the ability to call AWS APIs for
      # terraform plan (read-only describe calls).
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan \
          2>&1 | tee plan_output.txt
        continue-on-error: true

      # Post the plan output as a PR comment so reviewers can see what
      # will change without running Terraform locally.
      - name: Post plan to PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const maxLen = 65000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... (truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  infracost:
    name: Cost estimate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # post the cost estimate as a PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # no step pushes with git; don't leave the token on disk
      - name: Set up Infracost
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # Infracost generates a cost estimate from the Terraform code
      # without needing AWS credentials or a live state file.
      # It posts the breakdown as a PR comment showing which resources
      # cost what and flags any resources with unknown costs.
      - name: Generate cost estimate
        run: |
          infracost breakdown \
            --path=${{ env.WORKING_DIR }} \
            --format=json \
            --out-file=infracost.json \
            --show-skipped

      - name: Post cost estimate to PR
        uses: infracost/actions/comment@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.1
        with:
          path: infracost.json
          behavior: update   # updates existing comment rather than posting a new one
